# DPAppRegistry on one host, without the store page (deploy.sh with STORE=off):
#   /        the dashboard, for admins
#   /api/    the API
#   /files/  public builds; the bucket paths below serve signed links

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{DOMAIN}};

    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include snippets/dpappregistry-api.conf;
    include snippets/dpappregistry-files.conf;

    # Where the dashboard was when a store page shared the host.
    location = /registry {
        return 301 /;
    }

    location ^~ /registry/ {
        rewrite ^/registry/(.*)$ /$1 permanent;
    }

    # The dashboard. Its file names carry a content hash; every other path is
    # one of its routes.
    location /assets/ {
        root /var/www/dpappregistry/registry;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /var/www/dpappregistry/registry;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
