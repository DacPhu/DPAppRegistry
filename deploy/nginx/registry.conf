# DPAppRegistry on one host, without the store page (deploy.sh with STORE=off):
#   /        the dashboard, for admins; with ADMIN=tunnel a 404, the dashboard
#            being on the admin site (admin.conf)
#   /api/    the API
#   /files/  public builds; the bucket paths below serve signed links

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{DOMAIN}};

    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # For the log shipper (log-format.conf).
    access_log /var/log/nginx/sites/dpappregistry.access.log dpappregistry_json;

    include snippets/dpappregistry-api.conf;
    include snippets/dpappregistry-files.conf;

    # Where the dashboard was when a store page shared the host.
    location = /registry {
        return 301 /;
    }

    location ^~ /registry/ {
        rewrite ^/registry/(.*)$ /$1 permanent;
    }

    # The dashboard (dashboard.conf), or the 404s in its place
    # (dashboard-hidden.conf); server-setup.sh picks one.
    include snippets/{{DASHBOARD}};
}
