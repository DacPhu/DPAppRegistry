# Storage.

# Public builds: Garage serves the public bucket as a website and picks the
# bucket from the Host header.
location /files/ {
    proxy_pass http://127.0.0.1:3902/;
    proxy_set_header Host dpappregistry-public.web.garage.localhost;
    proxy_buffering off;
    proxy_read_timeout 600s;
}

# The S3 API, path-style, for signed download and upload links and for the
# API's own writes. The Host header and the path stay exactly as signed.
location ~ ^/dpappregistry-(public|private)(/|$) {
    proxy_pass http://127.0.0.1:3900;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
