# The admin site (deploy.sh ADMIN=tunnel): the dashboard and the API beside
# it, on the server's loopback only. Admins forward a local port to it over
# SSH and open http://localhost:3310; the dashboard signs in there, from its
# own origin, since the public site no longer lets anyone sign in.

server {
    listen 127.0.0.1:3310;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Apart from the public site's log, which the log shipper reads.
    access_log /var/log/nginx/dpappregistry-admin.access.log dpappregistry_json;

    include snippets/dpappregistry-api.conf;
    include snippets/dpappregistry-dashboard.conf;
}
