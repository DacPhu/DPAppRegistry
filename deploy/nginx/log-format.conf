# DPAppRegistry's access logs: one JSON object per request, with the infra
# repo's infra_json fields, for its log shipper (Alloy). The path only ($uri,
# never the query string, which carries tokens); request_id is the
# X-Request-ID the API is sent (api.conf) and logs as trace=.
# server-setup.sh installs it in conf.d/, which nginx reads before the sites.
log_format dpappregistry_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
