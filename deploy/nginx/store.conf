# DPAppRegistry on one host:
#   /            the store, for users
#   /@<account>/ an account's own store page
#   /registry/   the dashboard, for admins; with ADMIN=tunnel a 404, the
#                dashboard being on the admin site (admin.conf)
#   /api/        the API
#   /files/      public builds; the bucket paths below serve signed links

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{DOMAIN}};

    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # For the log shipper (log-format.conf).
    access_log /var/log/nginx/sites/dpappregistry.access.log dpappregistry_json;

    include snippets/dpappregistry-api.conf;
    include snippets/dpappregistry-files.conf;

    location = /registry {
        return 301 /registry/;
    }

    # The dashboard at /registry/ (dashboard.conf), or the 404s in its place
    # (dashboard-hidden.conf); server-setup.sh picks one.
    include snippets/{{DASHBOARD}};

    # An account's own store page, /@<account>/: the same page, which reads the
    # account from its path, with its files served from the store's folder.
    location ~ ^/@[a-z0-9-]+$ {
        return 301 $uri/;
    }

    location ~ ^/@[a-z0-9-]+/(?<store_file>[^/]*)$ {
        root /var/www/dpappregistry/store;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files /$store_file /index.html =404;
    }

    # An order's page: the store page itself, which reads the order from its
    # path. Never cached: once paid it shows a license key.
    location ^~ /order/ {
        root /var/www/dpappregistry/store;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    # The store page.
    location / {
        root /var/www/dpappregistry/store;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }
}
