# The dashboard, at {{BASE}}: on the public site (deploy.sh ADMIN=public), or
# only on the admin site (admin.conf, ADMIN=tunnel). server-setup.sh fills in
# its path and folder. Its file names carry a content hash; every other path
# is one of its routes.
location {{BASE}}assets/ {
    root {{ROOT}};
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location {{BASE}} {
    root {{ROOT}};
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri {{BASE}}index.html;
}
