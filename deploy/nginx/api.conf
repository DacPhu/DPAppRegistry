# The API, at /api/. Builds are uploaded through it, so bodies
# can be large and are streamed rather than buffered.
location /api/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # nginx's id for the request, in place of any the client sent: the API logs
    # it as trace=, nginx's access log as request_id.
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 4g;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
