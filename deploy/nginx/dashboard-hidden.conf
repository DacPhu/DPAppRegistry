# The public site's answer where the dashboard was, when admins reach it only
# through the SSH tunnel (deploy.sh ADMIN=tunnel, admin.conf): 404, and the
# same for signing in and signing up. These exact matches win over api.conf's
# /api/ prefix; the rest of the API (update checks, CI uploads with a token)
# stays public. server-setup.sh fills in the dashboard's path.
location {{BASE}} {
    return 404;
}

location = /api/login {
    return 404;
}

location = /api/signup {
    return 404;
}
